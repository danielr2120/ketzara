# Blueprint de Render para el backend (FastAPI).
# La base de datos vive en Supabase; DATABASE_URL se define en el panel de Render.
services:
  - type: web
    name: ketzara-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Aplica las migraciones pendientes antes de arrancar (el plan gratuito no tiene pre-deploy).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: America/Bogota
